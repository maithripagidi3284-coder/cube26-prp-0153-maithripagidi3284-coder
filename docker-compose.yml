services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prep_manager
      POSTGRES_PASSWORD: prep_manager
      POSTGRES_DB: prep_manager
    ports:
      - "5432:5432"
    volumes:
      - prep_manager_db:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://prep_manager:prep_manager@db:5432/prep_manager
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PREP_MANAGER_VISION_MODEL: qwen/qwen3.8-27b
      PREP_MANAGER_STORAGE_DIR: /data/images
    ports:
      - "8008:8000"
    volumes:
      - prep_manager_images:/data/images

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  prep_manager_db:
  prep_manager_images:
